<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <title>RepsnSets</title>
    <script>
      // Applies the saved theme before first paint to avoid a flash of the
      // wrong palette. Mirrors src/features/theme/themeStorage.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('repsnsets.theme')
          var preference =
            stored === 'light' || stored === 'dark' ? stored : 'system'
          var theme =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference

          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#0a0c10' : '#f5f6f2')
        } catch (error) {
          /* Falls back to the dark default on the html element. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
